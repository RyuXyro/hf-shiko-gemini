<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>⛺ Nadeshiko DevSecOps AI</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <style>
            body {
                background-color: #0b1120;
                color: #f8fafc;
            }
            .prose pre {
                background: #020617;
                border: 1px solid #1e293b;
                padding: 2.25rem 1rem 1rem 1rem;
                border-radius: 0.75rem;
                overflow-x: auto;
                margin-top: 0.75rem;
                margin-bottom: 0.75rem;
                position: relative;
            }
            .prose code {
                color: #38bdf8;
                font-family: ui-monospace, monospace;
                font-size: 0.85rem;
            }
            .prose p {
                margin-bottom: 0.5rem;
            }
            .prose ul,
            .prose ol {
                margin-left: 1.25rem;
                list-style-type: disc;
                margin-bottom: 0.5rem;
            }
            .copy-btn {
                position: absolute;
                top: 0.45rem;
                right: 0.5rem;
                background: #1e293b;
                color: #cbd5e1;
                font-size: 0.7rem;
                padding: 0.2rem 0.55rem;
                border-radius: 0.375rem;
                border: 1px solid #334155;
                cursor: pointer;
                transition: all 0.15s;
            }
            .copy-btn:hover {
                background: #ec4899;
                color: white;
                border-color: #ec4899;
            }
            /* Custom Scrollbar */
            ::-webkit-scrollbar {
                width: 6px;
                height: 6px;
            }
            ::-webkit-scrollbar-track {
                background: transparent;
            }
            ::-webkit-scrollbar-thumb {
                background: #1e293b;
                border-radius: 9999px;
            }
            ::-webkit-scrollbar-thumb:hover {
                background: #334155;
            }
        </style>
    </head>
    <body class="h-screen flex overflow-hidden font-sans">
        <!-- Layar Login -->
        <div id="login-screen" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 max-w-sm w-full shadow-2xl text-center">
                <div class="text-5xl mb-3">⛺🔒</div>
                <h2 class="text-xl font-bold text-pink-400 mb-1">Nadeshiko Command Center</h2>
                <p class="text-xs text-slate-400 mb-6">Masukkan kunci akses pribadi untuk membuka dashboard</p>

                <form id="login-form" class="space-y-4">
                    <input
                        type="password"
                        id="password-input"
                        placeholder="Masukkan Password..."
                        required
                        class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-center focus:outline-none focus:border-pink-400"
                    />
                    <p id="login-error" class="text-xs text-red-400 hidden">Password salah! Coba lagi ya~</p>
                    <button
                        type="submit"
                        id="login-btn"
                        class="w-full bg-pink-500 hover:bg-pink-600 text-white font-semibold py-3 rounded-xl text-sm transition"
                    >
                        Buka Dashboard
                    </button>
                </form>
            </div>
        </div>

        <!-- Sidebar History Ala Gemini -->
        <aside
            id="sidebar"
            class="w-72 bg-slate-900/95 border-r border-slate-800/80 flex flex-col justify-between transition-all duration-200 shrink-0"
        >
            <!-- Bagian Atas Sidebar -->
            <div class="p-3.5 flex flex-col h-full overflow-hidden">
                <div class="flex items-center justify-between mb-4 px-1">
                    <div class="flex items-center gap-2.5">
                        <span class="text-2xl">⛺</span>
                        <span class="font-bold text-base text-pink-400 tracking-tight">Nadeshiko</span>
                    </div>
                    <button
                        type="button"
                        onclick="toggleSidebar()"
                        title="Tutup Sidebar"
                        class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition"
                    >
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16"
                            />
                        </svg>
                    </button>
                </div>

                <!-- Tombol New Chat -->
                <button
                    type="button"
                    onclick="createNewSession()"
                    class="w-full flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700/90 text-slate-100 text-sm font-medium transition mb-5 border border-slate-700/70 shadow-sm"
                >
                    <span class="text-pink-400 text-lg leading-none">+</span>
                    <span>New chat</span>
                </button>

                <!-- Daftar Riwayat Obrolan (Recent) -->
                <div class="flex-1 overflow-y-auto pr-1 space-y-1">
                    <p class="px-2 text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-2">Recent</p>
                    <div id="session-list" class="space-y-1"></div>
                </div>

                <!-- Menu Bawah Sidebar -->
                <div class="pt-3 mt-2 border-t border-slate-800/80 space-y-1.5">
                    <button
                        type="button"
                        onclick="setPrompt('/gambar ')"
                        class="w-full text-left px-3 py-2 rounded-lg hover:bg-slate-800/70 text-xs text-pink-300 transition flex items-center gap-2.5"
                    >
                        <span>🎨</span> Buat Gambar Gratis
                    </button>
                    <button
                        type="button"
                        onclick="logout()"
                        class="w-full text-left px-3 py-2 rounded-lg hover:bg-red-500/10 text-xs text-red-400 transition flex items-center gap-2.5"
                    >
                        <span>🔒</span> Kunci / Logout
                    </button>
                </div>
            </div>
        </aside>

        <!-- Area Utama Chat -->
        <main class="flex-1 flex flex-col h-full min-w-0 bg-gradient-to-b from-slate-950 via-[#0b1120] to-slate-950">
            <!-- Header Minimalis -->
            <header class="h-14 px-5 flex items-center justify-between shrink-0">
                <div class="flex items-center gap-3">
                    <button
                        type="button"
                        id="open-sidebar-btn"
                        onclick="toggleSidebar()"
                        title="Buka Sidebar"
                        class="hidden p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition"
                    >
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16"
                            />
                        </svg>
                    </button>
                    <span
                        id="current-chat-title"
                        class="font-medium text-sm text-slate-300 truncate max-w-xs sm:max-w-md"
                        >New chat</span
                    >
                </div>
                <div class="flex items-center gap-2 text-xs text-slate-400">
                    <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                    <span class="hidden sm:inline">Private Space Ready</span>
                </div>
            </header>

            <!-- Kontainer Pesan / Layar Selamat Datang -->
            <div id="chat-box" class="flex-1 overflow-y-auto px-4 sm:px-8 py-6">
                <div id="chat-container" class="max-w-3xl mx-auto space-y-5"></div>
            </div>

            <!-- Pratinjau Gambar Sebelum Dikirim -->
            <div id="image-preview-bar" class="hidden px-4 sm:px-8 py-2">
                <div
                    class="max-w-3xl mx-auto flex items-center gap-3 bg-slate-900 border border-slate-700/80 p-2.5 rounded-xl"
                >
                    <img
                        id="image-preview-thumb"
                        src=""
                        class="h-12 w-12 object-cover rounded-lg border border-pink-400"
                    />
                    <div class="flex-1 text-xs text-slate-300">
                        <p class="font-semibold text-pink-300">Screenshot / Gambar terlampir</p>
                        <p class="text-slate-400">Siap dianalisis oleh Nadeshiko</p>
                    </div>
                    <button
                        type="button"
                        onclick="removeAttachedImage()"
                        class="text-xs bg-slate-800 hover:bg-red-500/20 text-red-400 px-2.5 py-1.5 rounded-lg"
                    >
                        ✕
                    </button>
                </div>
            </div>

            <!-- Kotak Input Ala Gemini -->
            <div class="p-4 sm:px-8 pb-6 shrink-0">
                <form
                    id="chat-form"
                    class="max-w-3xl mx-auto bg-slate-900/90 border border-slate-700/80 rounded-2xl p-2.5 shadow-xl focus-within:border-slate-600 transition"
                >
                    <textarea
                        id="user-input"
                        rows="1"
                        placeholder="Tanya Nadeshiko, tempel kode, Ctrl+V gambar, atau ketik /gambar..."
                        class="w-full bg-transparent px-3 py-2 text-sm text-slate-100 placeholder-slate-400 focus:outline-none resize-none max-h-40"
                    ></textarea>

                    <div class="flex items-center justify-between pt-1.5 px-1">
                        <!-- Tombol Aksi Kiri (Upload & Pintasan) -->
                        <div class="flex items-center gap-1.5">
                            <input type="file" id="file-input" accept="image/*" class="hidden" />
                            <button
                                type="button"
                                onclick="document.getElementById('file-input').click()"
                                title="Unggah Gambar / Screenshot"
                                class="p-2 rounded-xl hover:bg-slate-800 text-slate-300 text-sm transition flex items-center gap-1"
                            >
                                <span>+</span>
                            </button>
                            <button
                                type="button"
                                onclick="setPrompt('Bantu review celah keamanan kode ini:\n')"
                                title="Audit Keamanan"
                                class="hidden sm:flex items-center gap-1 px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-800 text-xs text-slate-300 transition"
                            >
                                <span>🛡️</span> Audit
                            </button>
                            <button
                                type="button"
                                onclick="setPrompt('Buatkan skrip coding untuk: ')"
                                title="Generator Kode"
                                class="hidden sm:flex items-center gap-1 px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-800 text-xs text-slate-300 transition"
                            >
                                <span>💻</span> Code
                            </button>
                            <button
                                type="button"
                                onclick="setPrompt('Susun jadwal & prioritas tugas hari ini:\n')"
                                title="Planner Harian"
                                class="hidden sm:flex items-center gap-1 px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-800 text-xs text-slate-300 transition"
                            >
                                <span>📋</span> Plan
                            </button>
                        </div>

                        <!-- Dropdown Model & Tombol Kirim di Kanan (Persis Gemini) -->
                        <div class="flex items-center gap-2">
                            <select
                                id="model-select"
                                class="bg-transparent hover:bg-slate-800 text-xs text-slate-300 px-2.5 py-1.5 rounded-lg focus:outline-none cursor-pointer"
                            >
                                <option value="gemini-3.5-flash-lite" class="bg-slate-900">Flash-Lite</option>
                                <option value="gemini-3.8-flash" class="bg-slate-900">Flash 3.8</option>
                                <option value="gemini-4-hydrogen" class="bg-slate-900">Hydrogen Pro</option>
                            </select>
                            <button
                                type="submit"
                                id="send-btn"
                                class="bg-pink-500 hover:bg-pink-600 text-white font-semibold px-4 py-1.5 rounded-xl text-xs transition"
                            >
                                Kirim
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </main>

        <script>
            const loginScreen = document.getElementById("login-screen");
            const loginForm = document.getElementById("login-form");
            const passwordInput = document.getElementById("password-input");
            const loginError = document.getElementById("login-error");
            const loginBtn = document.getElementById("login-btn");
            const sidebar = document.getElementById("sidebar");
            const openSidebarBtn = document.getElementById("open-sidebar-btn");
            const sessionListEl = document.getElementById("session-list");
            const currentChatTitle = document.getElementById("current-chat-title");
            const chatBox = document.getElementById("chat-box");
            const chatContainer = document.getElementById("chat-container");
            const chatForm = document.getElementById("chat-form");
            const userInput = document.getElementById("user-input");
            const sendBtn = document.getElementById("send-btn");
            const modelSelect = document.getElementById("model-select");
            const fileInput = document.getElementById("file-input");
            const previewBar = document.getElementById("image-preview-bar");
            const previewThumb = document.getElementById("image-preview-thumb");
            let savedPassword = sessionStorage.getItem("nadeshiko_pass") || "";
            let attachedImageBase64 = null;
            // Struktur Multi-Sesi Obrolan di localStorage
            let sessions = [];
            try {
                sessions = JSON.parse(localStorage.getItem("nadeshiko_sessions") || "[]");
            } catch (e) {
                sessions = [];
            }
            let activeSessionId = localStorage.getItem("nadeshiko_active_id") || null;
            if (savedPassword) {
                loginScreen.classList.add("hidden");
            }
            // Responsif: tutup sidebar otomatis di layar HP saat awal buka
            if (window.innerWidth < 768) {
                sidebar.classList.add("hidden");
                openSidebarBtn.classList.remove("hidden");
            }
            function toggleSidebar() {
                sidebar.classList.toggle("hidden");
                if (sidebar.classList.contains("hidden")) {
                    openSidebarBtn.classList.remove("hidden");
                } else {
                    openSidebarBtn.classList.add("hidden");
                }
            }
            function saveSessions() {
                localStorage.setItem("nadeshiko_sessions", JSON.stringify(sessions));
                if (activeSessionId) {
                    localStorage.setItem("nadeshiko_active_id", activeSessionId);
                }
            }
            function getActiveSession() {
                return sessions.find(function (s) {
                    return s.id === activeSessionId;
                });
            }
            function createNewSession() {
                const newId = "chat_" + Date.now();
                const newSession = {
                    id: newId,
                    title: "New chat",
                    messages: [],
                };
                sessions.unshift(newSession);
                activeSessionId = newId;
                saveSessions();
                renderSidebar();
                renderChatArea();
            }
            function switchSession(id) {
                activeSessionId = id;
                saveSessions();
                renderSidebar();
                renderChatArea();
                if (window.innerWidth < 768) {
                    toggleSidebar();
                }
            }
            function deleteSession(id, event) {
                event.stopPropagation();
                sessions = sessions.filter(function (s) {
                    return s.id !== id;
                });
                if (activeSessionId === id) {
                    activeSessionId = sessions.length > 0 ? sessions.id : null;
                }
                if (!activeSessionId) {
                    createNewSession();
                    return;
                }
                saveSessions();
                renderSidebar();
                renderChatArea();
            }
            function renderSidebar() {
                sessionListEl.innerHTML = "";
                sessions.forEach(function (sess) {
                    const isActive = sess.id === activeSessionId;
                    const item = document.createElement("div");
                    item.onclick = function () {
                        switchSession(sess.id);
                    };
                    item.className =
                        "group flex items-center justify-between px-3 py-2 rounded-xl text-xs cursor-pointer transition " +
                        (isActive ? "bg-slate-800 text-pink-300 font-medium" : "text-slate-300 hover:bg-slate-800/50");
                    const titleSpan = document.createElement("span");
                    titleSpan.className = "truncate flex-1 pr-2";
                    titleSpan.textContent = sess.title;
                    const delBtn = document.createElement("button");
                    delBtn.type = "button";
                    delBtn.textContent = "✕";
                    delBtn.title = "Hapus obrolan ini";
                    delBtn.className =
                        "opacity-0 group-hover:opacity-100 text-slate-500 hover:text-red-400 px-1 transition";
                    delBtn.onclick = function (e) {
                        deleteSession(sess.id, e);
                    };
                    item.appendChild(titleSpan);
                    item.appendChild(delBtn);
                    sessionListEl.appendChild(item);
                });
            }
            function renderChatArea() {
                const current = getActiveSession();
                if (!current) {
                    createNewSession();
                    return;
                }
                currentChatTitle.textContent = current.title;
                chatContainer.innerHTML = "";
                // Jika obrolan masih kosong, tampilkan layar sapaan ala Gemini
                if (current.messages.length === 0) {
                    chatContainer.innerHTML =
                        "" +
                        "⛺✨" +
                        "Yahallo! Mau mulai dari mana hari ini?" +
                        "Siap membantu ngoding, audit keamanan siber, menyusun jadwal kerja, menganalisis screenshot, hingga membuat gambar gratis." +
                        "";
                    return;
                }
                current.messages.forEach(function (msg) {
                    appendMessage(msg.role === "user" ? "user" : "ai", msg.content, msg.isImage, msg.userImg);
                });
            }
            // Inisialisasi awal
            if (sessions.length === 0) {
                createNewSession();
            } else {
                if (!getActiveSession()) activeSessionId = sessions.id;
                renderSidebar();
                renderChatArea();
            }
            // Auto-resize textarea
            userInput.addEventListener("input", function () {
                this.style.height = "auto";
                this.style.height = this.scrollHeight + "px";
            });
            userInput.addEventListener("keydown", function (e) {
                if (e.key === "Enter" && !e.shiftKey) {
                    e.preventDefault();
                    chatForm.dispatchEvent(new Event("submit"));
                }
            });
            window.addEventListener("paste", function (e) {
                if (!e.clipboardData || !e.clipboardData.items) return;
                const items = e.clipboardData.items;
                for (let i = 0; i < items.length; i++) {
                    if (items[i].type.indexOf("image/") === 0) {
                        const file = items[i].getAsFile();
                        processImageFile(file);
                    }
                }
            });
            fileInput.addEventListener("change", function (e) {
                if (e.target.files && e.target.files.length > 0) {
                    processImageFile(e.target.files);
                }
            });
            function processImageFile(file) {
                const reader = new FileReader();
                reader.onload = function (event) {
                    attachedImageBase64 = event.target.result;
                    previewThumb.src = attachedImageBase64;
                    previewBar.classList.remove("hidden");
                };
                reader.readAsDataURL(file);
            }
            function removeAttachedImage() {
                attachedImageBase64 = null;
                fileInput.value = "";
                previewBar.classList.add("hidden");
            }
            function enhanceCodeBlocks(container) {
                const blocks = container.querySelectorAll("pre");
                blocks.forEach(function (pre) {
                    if (pre.querySelector(".copy-btn")) return;
                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.className = "copy-btn";
                    btn.textContent = "Salin Kode";
                    btn.onclick = function () {
                        const codeEl = pre.querySelector("code");
                        const codeText = codeEl ? codeEl.innerText : pre.innerText;
                        navigator.clipboard.writeText(codeText);
                        btn.textContent = "Tersalin!";
                        setTimeout(function () {
                            btn.textContent = "Salin Kode";
                        }, 2000);
                    };
                    pre.appendChild(btn);
                });
            }
            loginForm.addEventListener("submit", async function (e) {
                e.preventDefault();
                const pass = passwordInput.value;
                loginBtn.disabled = true;
                loginBtn.textContent = "Memeriksa...";
                loginError.classList.add("hidden");
                try {
                    const res = await fetch("/api/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ password: pass, verifyOnly: true }),
                    });
                    if (res.ok) {
                        savedPassword = pass;
                        sessionStorage.setItem("nadeshiko_pass", pass);
                        loginScreen.classList.add("hidden");
                    } else {
                        loginError.classList.remove("hidden");
                    }
                } catch (err) {
                    loginError.textContent = "Gagal terhubung ke server.";
                    loginError.classList.remove("hidden");
                } finally {
                    loginBtn.disabled = false;
                    loginBtn.textContent = "Buka Dashboard";
                }
            });
            function logout() {
                sessionStorage.removeItem("nadeshiko_pass");
                savedPassword = "";
                passwordInput.value = "";
                loginScreen.classList.remove("hidden");
            }
            function setPrompt(text) {
                userInput.value = text;
                userInput.focus();
            }
            function appendMessage(sender, content, isImage, userImgSrc) {
                const wrapper = document.createElement("div");
                wrapper.className = sender === "user" ? "flex justify-end" : "flex justify-start";
                const bubble = document.createElement("div");
                bubble.className =
                    sender === "user"
                        ? "bg-slate-800 border border-slate-700 text-slate-100 rounded-2xl rounded-br-sm px-4 py-3 max-w-2xl text-sm whitespace-pre-wrap"
                        : "text-slate-100 rounded-2xl px-2 py-1 max-w-3xl w-full text-sm prose prose-invert";
                if (sender === "user") {
                    let html = "";
                    if (userImgSrc) {
                        html += "";
                    }
                    const safeText = content
                        ? String(content).replace(/</g, "<").replace(/>/g, ">")
                        : "(Mengirim gambar)";
                    html += safeText;
                    bubble.innerHTML = html;
                } else if (isImage && content && content.url) {
                    bubble.innerHTML = "⛺Taraaa! Gambarnya sudah jadi! ✨";
                } else {
                    const parsedHtml = typeof marked !== "undefined" ? marked.parse(String(content)) : String(content);
                    bubble.innerHTML = "⛺" + parsedHtml + "";
                    enhanceCodeBlocks(bubble);
                }
                wrapper.appendChild(bubble);
                chatContainer.appendChild(wrapper);
                chatBox.scrollTop = chatBox.scrollHeight;
                return bubble;
            }
            chatForm.addEventListener("submit", async function (e) {
                e.preventDefault();
                const text = userInput.value.trim();
                const currentImg = attachedImageBase64;
                if (!text && !currentImg) return;
                const currentSession = getActiveSession();
                // Jika ini pesan pertama di sesi baru, bersihkan layar sapaan & buat judul otomatis
                if (currentSession.messages.length === 0) {
                    chatContainer.innerHTML = "";
                    const rawTitle = text || "Analisis Gambar";
                    currentSession.title = rawTitle.length > 32 ? rawTitle.substring(0, 32) + "..." : rawTitle;
                    currentChatTitle.textContent = currentSession.title;
                    renderSidebar();
                }
                appendMessage("user", text, false, currentImg);
                userInput.value = "";
                userInput.style.height = "auto";
                removeAttachedImage();
                sendBtn.disabled = true;
                sendBtn.textContent = "...";
                const loadingBubble = appendMessage("ai", "⏳ Nadeshiko sedang berpikir...", false, null);
                try {
                    const res = await fetch("/api/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            message: text,
                            imageBase64: currentImg,
                            model: modelSelect.value,
                            history: currentSession.messages,
                            password: savedPassword,
                        }),
                    });
                    const data = await res.json();
                    loadingBubble.parentElement.remove();
                    if (res.status === 401) {
                        logout();
                        return;
                    }
                    if (!res.ok) {
                        appendMessage("ai", "⚠️ Error: " + (data.error || "Terjadi kesalahan"), false, null);
                        return;
                    }
                    currentSession.messages.push({ role: "user", content: text || "[Mengunggah Gambar]" });
                    const reply = Array.isArray(data.reply) ? data.reply : data.reply;
                    if (reply && typeof reply === "object" && reply.url) {
                        appendMessage("ai", reply, true, null);
                        currentSession.messages.push({ role: "assistant", content: "[Membuat gambar]", isImage: true });
                    } else {
                        appendMessage("ai", reply, false, null);
                        currentSession.messages.push({ role: "assistant", content: String(reply) });
                    }
                    if (currentSession.messages.length > 30) {
                        currentSession.messages = currentSession.messages.slice(-30);
                    }
                    saveSessions();
                } catch (err) {
                    loadingBubble.parentElement.remove();
                    appendMessage("ai", "⚠️ Koneksi gagal: " + err.message, false, null);
                } finally {
                    sendBtn.disabled = false;
                    sendBtn.textContent = "Kirim";
                }
            });
        </script>
    </body>
</html>
